
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Vato</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      color: #35e0a1;
      margin-top: 60px;
    }

    .card {
      max-width: 450px;
      margin: 35px auto;
      padding: 25px;
      background: #1d293b;
      border-radius: 18px;
    }

    button {
      background: #35e0a1;
      color: #101827;
      border: 0;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <section id="startseite">
    <div class="logo">VATO</div>
    <p>Deine Ideen. Deine Möglichkeiten.</p>

    <div class="card">
      <h2>Willkommen bei Vato!</h2>
      <p>Hier beginnt dein neues Projekt.</p>

      <button onclick="zeigeSeite('hauptseite')">
        Los geht's
      </button>
    </div>
  </section>

  <section id="hauptseite" class="hidden">
    <div class="logo">VATO</div>

    <div class="card">
      <h2>Du bist dabei!</h2>
      <p>Willkommen auf deiner Vato-Plattform.</p>
      <p>Hier bauen wir deine Ideen Schritt für Schritt auf.</p>

      <button onclick="zeigeSeite('startseite')">
        Zurück
      </button>
    </div>
  </section>

  <script>
    function zeigeSeite(seitenId) {
      document.getElementById('startseite')
        .classList.add('hidden');

      document.getElementById('hauptseite')
        .classList.add('hidden');

      document.getElementById(seitenId)
        .classList.remove('hidden');

      window.scrollTo(0, 0);
    }
  </script>

</body>
</html>
